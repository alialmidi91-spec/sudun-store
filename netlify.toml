# إعدادات النشر على Netlify (مجاني) — يقرأها Netlify تلقائياً
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# كل الصفحات (مثل /shop و /product/...) تفتح من index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# تخزين مؤقت طويل للملفات الثابتة لتسريع الموقع
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
