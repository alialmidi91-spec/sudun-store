name: Cloudflare Preview

on:
  workflow_dispatch:
    inputs:
      preview_name:
        description: Cloudflare preview Worker name
        required: true
        default: sudun-store-preview

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck, test, and build
        run: npm run build:check && npm test
      - name: Deploy preview Worker to Cloudflare
        run: npx wrangler@4 deploy --name "${{ inputs.preview_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
